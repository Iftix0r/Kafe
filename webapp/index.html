<!DOCTYPE html>
<html lang="uz" style="background:#fff">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menyu</title>
    <style>html,body{background:#fff!important;color:#000;min-height:100vh}</style>
    <script>
        // Telegram WebApp skripti yuklanishini tekshirish
        window.telegramLoaded = false;
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (!window.telegramLoaded && !window.Telegram) {
                    console.error('Telegram WebApp skripti yuklanmadi!');
                    document.body.innerHTML = `
                        <div style="padding:20px;text-align:center;color:red">
                            <h3>Xato!</h3>
                            <p>Telegram WebApp skripti yuklanmadi.</p>
                            <p>Iltimos, internetga ulanishni tekshiring.</p>
                            <button onclick="location.reload()" style="padding:10px;background:#2481cc;color:white;border:none;border-radius:4px">Qayta yuklash</button>
                        </div>
                    `;
                }
            }, 5000);
        });
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js" onload="window.telegramLoaded = true" onerror="console.error('Telegram script yuklanmadi')"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background:#fff">
    <div class="categories" id="categories"></div>
    <div id="menu"><p style="padding:20px;text-align:center">Yuklanmoqda...</p></div>
    <div class="comment-section">
        <textarea id="comment" rows="2" placeholder="Izoh (ixtiyoriy)..."></textarea>
    </div>
    
    <!-- Debug ma'lumotlari -->
    <div id="debug-info" style="position:fixed;bottom:10px;right:10px;background:rgba(0,0,0,0.8);color:white;padding:5px;font-size:10px;border-radius:3px;display:none;">
        Debug: <span id="debug-text">Ishga tushmoqda...</span>
    </div>
    
    <script>
        // Debug rejimini yoqish uchun
        if (window.location.search.includes('debug=1')) {
            document.getElementById('debug-info').style.display = 'block';
        }
        
        // Oddiy test
        setTimeout(() => {
            if (!document.getElementById('categories').innerHTML) {
                document.getElementById('menu').innerHTML = `
                    <div style="padding:20px;text-align:center">
                        <h3>Test rejimi</h3>
                        <p>Telegram WebApp: ${!!window.Telegram ? 'Mavjud' : 'Mavjud emas'}</p>
                        <p>Current URL: ${window.location.href}</p>
                        <button onclick="loadMenu()" style="padding:10px;margin:10px;background:#2481cc;color:white;border:none;border-radius:4px">Menu yuklash</button>
                        <button onclick="window.open('https://olmazor.bigsaver.ru/bot/api/menu.php', '_blank')" style="padding:10px;margin:10px;background:#28a745;color:white;border:none;border-radius:4px">API test</button>
                    </div>
                `;
            }
        }, 3000);
    </script>
    <script src="app.js"></script>
</body>
</html>
