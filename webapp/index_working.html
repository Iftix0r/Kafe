<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Olmazor Go</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --primary:#2481cc; --p-grad:linear-gradient(135deg, #2481cc, #1c6ba8); --sec:#f4f4f7; --text:#1a1c1e; --white:#ffffff; --nav-h:75px; --r:20px; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:var(--white); color:var(--text); padding-bottom:calc(var(--nav-h) + 20px); padding-top:20px; -webkit-user-select:none; }
        .hidden { display:none !important; }
        .view { display:none; padding:0 20px; animation:fadeIn 0.4s; }
        .view.active { display:block; }
        @keyframes fadeIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
        .loading { position:fixed; inset:0; background:white; display:flex; align-items:center; justify-content:center; z-index:9999; transition:0.5s; }
        .pulse { font-size:3.5rem; animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
        .cat-scroll { margin:0 -20px 15px; padding:5px 20px 15px; overflow-x:auto; display:flex; gap:10px; scrollbar-width:none; }
        .cat-scroll::-webkit-scrollbar { display:none; }
        .chip { white-space:nowrap; padding:10px 18px; border-radius:30px; background:var(--sec); font-size:0.9rem; font-weight:600; border:none; }
        .chip.active { background:var(--primary); color:white; }
        .grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
        .card { background:white; border-radius:var(--r); box-shadow:0 8px 30px rgba(0,0,0,0.05); overflow:hidden; border:1px solid rgba(0,0,0,0.03); display:flex; flex-direction:column; }
        .card img { width:100%; height:120px; object-fit:cover; background:var(--sec); }
        .p-12 { padding:12px; flex:1; display:flex; flex-direction:column; }
        .price { font-weight:800; color:var(--primary); margin:5px 0; }
        .btn { width:100%; padding:10px; border-radius:12px; background:white; color:var(--primary); border:1.5px solid var(--primary); font-weight:700; cursor:pointer; }
        .qty { display:flex; align-items:center; justify-content:space-between; background:var(--sec); border-radius:12px; padding:4px; }
        .qty button { width:30px; height:30px; border-radius:8px; border:none; background:white; font-weight:700; }
        .hero { background:var(--p-grad); margin:0 -20px 20px; padding:40px 20px; text-align:center; color:white; border-radius:0 0 35px 35px; }
        .avatar { width:80px; height:80px; background:rgba(255,255,255,0.2); border:2px solid white; border-radius:50%; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:2.5rem; overflow:hidden; }
        .nav { position:fixed; bottom:0; inset-x:0; height:var(--nav-h); background:rgba(255,255,255,0.8); backdrop-filter:blur(15px); display:flex; justify-content:space-around; align-items:center; border-top:1px solid rgba(0,0,0,0.05); z-index:1000; }
        .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:0.75rem; font-weight:700; color:#777; position:relative; }
        .nav-item.active { color:var(--primary); }
        .badge { position:absolute; top:-5px; right:15%; background:#ef4444; color:white; font-size:0.65rem; padding:2px 6px; border-radius:10px; }
        .float-btn { position:fixed; bottom:calc(var(--nav-h) + 15px); inset-x:15px; background:var(--p-grad); color:white; padding:16px; border-radius:15px; font-weight:800; text-align:center; box-shadow:0 10px 20px rgba(0,0,0,0.15); animation:pop 0.3s; z-index:900; }
        @keyframes pop { from{transform:scale(0.8); opacity:0} }
    </style>
</head>
<body>
    <div id="ls" class="loading"><div class="pulse">🍽️</div></div>
    
    <main id="v-menu" class="view active">
        <div class="cat-scroll" id="cats"></div>
        <div class="grid" id="grid"></div>
    </main>

    <main id="v-cart" class="view">
        <h2 style="margin-bottom:15px">Savat</h2>
        <div id="c-list"></div>
        <div id="c-empty" class="hidden" style="text-align:center; padding:40px; opacity:0.5">🛒 Bo'sh</div>
        <div id="c-sum" class="hidden">
            <textarea id="note" placeholder="Izoh..." style="width:100%; border:none; background:var(--sec); border-radius:12px; padding:12px; margin:15px 0; min-height:70px"></textarea>
            <div style="padding:15px; background:var(--sec); border-radius:12px; display:flex; justify-content:space-between; font-weight:800">Jami: <span id="c-total" style="color:var(--primary)">0</span></div>
            <button class="btn" onclick="app.order()" style="background:var(--primary); color:white; height:55px; margin-top:15px; border:none">Sotib olish</button>
        </div>
    </main>

    <main id="v-prof" class="view">
        <div class="hero">
            <div class="avatar" id="u-avatar">👤</div>
            <h2 id="u-name">Yuklanmoqda...</h2>
            <div id="u-id" style="opacity:0.7">...</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:10px">
            <div style="padding:15px; background:var(--sec); border-radius:15px; font-weight:600">📞 Tel: <span id="u-phone">Kutilmoqda...</span></div>
            <div id="debug" style="font-size:0.6rem; color:#aaa; text-align:center; margin-top:20px">v4.0 | No Data Yet</div>
        </div>
    </main>

    <div class="float-btn hidden" id="f-btn" onclick="app.tab('cart')">🛒 Savatga o'tish — <span id="f-total">0</span></div>

    <nav class="nav">
        <div class="nav-item active" id="n-menu" onclick="app.tab('menu')"><span>🍽️</span>Menyu</div>
        <div class="nav-item" id="n-cart" onclick="app.tab('cart')"><span>🛒</span>Savat<div class="badge hidden" id="badge">0</div></div>
        <div class="nav-item" id="n-prof" onclick="app.tab('prof')"><span>👤</span>Profil</div>
    </nav>

    <script>
        class App {
            constructor() {
                this.tg = window.Telegram?.WebApp;
                this.cart = {}; this.items = []; this.cur = 'menu';
                this.API = 'https://olmazorgo.bigsaver.ru/bot/api/menu.php';
            }
            async init() {
                if (this.tg) { this.tg.ready(); this.tg.expand(); this.syUser(); }
                await this.load();
                setTimeout(() => { const l = document.getElementById('ls'); if(l){ l.style.opacity='0'; setTimeout(()=>l.remove(),500); } }, 800);
            }
            async syUser() {
                const debug = document.getElementById('debug');
                let u = this.tg?.initDataUnsafe?.user;
                
                // Fallback attempt
                if (!u && this.tg?.initData) {
                    try {
                        const p = new URLSearchParams(this.tg.initData);
                        const s = p.get('user');
                        if (s) u = JSON.parse(s);
                        if (debug) debug.textContent = "v4.0 | Parsed from initData";
                    } catch(e) { if(debug) debug.textContent = "v4.0 | Parse Error: " + e.message; }
                } else if (!u) {
                    if (debug) debug.textContent = "v4.0 | No initData found at all";
                }

                if (u) {
                    document.getElementById('u-name').textContent = u.first_name + (u.last_name ? ' ' + u.last_name : '');
                    document.getElementById('u-id').textContent = u.username ? '@' + u.username : 'ID: ' + u.id;
                    if (u.photo_url) document.getElementById('u-avatar').innerHTML = `<img src="${u.photo_url}" style="width:100%;height:100%;object-fit:cover">`;
                    
                    try {
                        const r = await fetch('/bot/api/user.php?id=' + u.id);
                        const d = await r.json();
                        if (d.ok && d.user) {
                            if (d.user.phone_number) document.getElementById('u-phone').textContent = d.user.phone_number;
                            if (d.user.first_name) document.getElementById('u-name').textContent = d.user.first_name + (d.user.last_name ? ' ' + d.user.last_name : '');
                        } else { document.getElementById('u-phone').textContent = "Topilmadi"; }
                    } catch(e) { document.getElementById('u-phone').textContent = "Xato"; }
                } else {
                    document.getElementById('u-name').textContent = "Mehmon";
                }
            }
            async load() { try { const r = await fetch(this.API); this.items = await r.json(); this.rCat(); this.rG(); } catch(e){} }
            rCat() {
                const c = document.getElementById('cats'); c.innerHTML = '<button class="chip active" onclick="app.fil(\'all\',this)">Barchasi</button>';
                this.items.forEach(cat => c.innerHTML += `<button class="chip" onclick="app.fil(${cat.id},this)">${cat.name}</button>`);
            }
            rG(id = 'all') {
                const g = document.getElementById('grid'); g.innerHTML = '';
                let l = (id==='all')?this.items.flatMap(c=>c.items):(this.items.find(c=>c.id==id)?.items||[]);
                l.forEach(i => {
                    const d = document.createElement('div'); d.className = 'card';
                    const q = this.cart[i.id]?.q || 0;
                    d.innerHTML = `<img src="${i.image_url||''}" onerror="this.src='https://via.placeholder.com/150'"><div class="p-12"><div style="font-weight:700;font-size:0.9rem">${i.name}</div><div class="price">${this.fmt(i.price)}</div><div id="i-${i.id}">${q>0?this.qH(i.id,q):`<button class="btn" onclick="app.add(${i.id},'${i.name}',${i.price})">Qo'shish</button>`}</div></div>`;
                    g.appendChild(d);
                });
            }
            qH(id,q) { return `<div class="qty"><button onclick="app.ch(${id},-1)">−</button><span>${q}</span><button onclick="app.ch(${id},1)">+</button></div>`; }
            fil(id,b) { document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); b.classList.add('active'); this.rG(id); this.tg?.HapticFeedback.selectionChanged(); }
            add(id,n,p) { this.cart[id]={id,n,p,q:1}; this.up(id); this.tg?.HapticFeedback.impactOccurred('light'); }
            ch(id,d) { if(!this.cart[id])return; this.cart[id].q+=d; if(this.cart[id].q<=0)delete this.cart[id]; this.up(id); if(this.cur==='cart')this.rC(); this.tg?.HapticFeedback.impactOccurred('light'); }
            up(id) { const c=document.getElementById(`i-${id}`); if(c)c.innerHTML=this.cart[id]?this.qH(id,this.cart[id].q):`<button class="btn" onclick="app.add(${id},'${this.find(id).name}',${this.find(id).price})">Qo'shish</button>`; this.sy(); }
            sy() {
                const l = Object.values(this.cart); const t = l.reduce((s,i)=>s+i.p*i.q, 0); const n = l.reduce((s,i)=>s+i.q, 0);
                const b = document.getElementById('badge'); if(b){ b.textContent=n; b.classList.toggle('hidden',n===0); }
                const f = document.getElementById('f-btn'); if(f){ if(n>0 && this.cur==='menu'){ f.classList.remove('hidden'); document.getElementById('f-total').textContent=this.fmt(t); } else f.classList.add('hidden'); }
            }
            tab(t) {
                if(this.cur===t)return; this.cur=t;
                document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); document.getElementById(`v-${t}`).classList.add('active');
                document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); document.getElementById(`n-${t}`).classList.add('active');
                if(t==='cart')this.rC(); this.sy(); this.tg?.HapticFeedback.selectionChanged(); window.scrollTo(0,0);
            }
            rC() {
                const l=document.getElementById('c-list'), e=document.getElementById('c-empty'), s=document.getElementById('c-sum'), list=Object.values(this.cart);
                if(list.length===0){ l.innerHTML=''; e.classList.remove('hidden'); s.classList.add('hidden'); }
                else {
                    e.classList.add('hidden'); s.classList.remove('hidden'); l.innerHTML='';
                    list.forEach(i=> {
                        const d=document.createElement('div'); d.style="display:flex;gap:10px;margin-bottom:10px;align-items:center";
                        d.innerHTML=`<div style="flex:1"><b>${i.n}</b><br><small>${this.fmt(i.p)}</small></div><div style="width:100px">${this.qH(i.id,i.q)}</div>`;
                        l.appendChild(d);
                    });
                    document.getElementById('c-total').textContent = this.fmt(list.reduce((s,i)=>s+i.p*i.q, 0));
                }
            }
            order() {
                const l=Object.values(this.cart); if(l.length===0)return;
                const d={items:l, total:l.reduce((s,i)=>s+i.p*i.q,0), note:document.getElementById('note').value};
                this.tg?.sendData(JSON.stringify(d)); this.tg?.close();
            }
            find(id) { return this.items.flatMap(c=>c.items).find(i=>i.id==id); }
            fmt(n) { return Number(n).toLocaleString('uz-UZ').replace(/,/g, ' ')+' so\'m'; }
        }
        const app = new App(); app.init();
    </script>
</body>
</html>
