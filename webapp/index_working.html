<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Olmazor Go</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #2481cc; --bg: #ffffff; --t: #1a1c1e; --sec: #f4f4f7; --r: 16px; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Montserrat',sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background-color: var(--bg) !important; color: var(--t) !important; padding-bottom: 90px; }
        .hidden { display:none !important; }

        /* LOADER: Classic CSS for Compatibility */
        #ls {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #ffffff !important; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10000;
        }
        .logo { font-size: 4rem; margin-bottom: 20px; }

        .view { display: none; padding: 15px; }
        .view.active { display: block; }

        .cat-bar { display: flex; gap: 8px; overflow-x: auto; padding: 5px 15px 15px; margin: 0 -15px; scrollbar-width: none; }
        .cat-btn { white-space: nowrap; padding: 10px 18px; border-radius: 25px; background: var(--sec); border: none; font-weight: 600; color: #555; }
        .cat-btn.active { background: var(--p); color: #fff; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: #fff; border-radius: var(--r); overflow: hidden; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 4px 15px rgba(0,0,0,0.03); display: flex; flex-direction: column; }
        .card img { width: 100%; height: 110px; object-fit: cover; background: var(--sec); }
        .card-body { padding: 10px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .name { font-weight: 600; font-size: 0.85rem; line-height: 1.2; height: 2.4em; overflow: hidden; }
        .price { font-weight: 800; color: var(--p); font-size: 0.9rem; margin: 5px 0; }
        .add-btn { width: 100%; padding: 8px; border-radius: 10px; background: #fff; color: var(--p); border: 1.5px solid var(--p); font-weight: 800; cursor: pointer; font-size: 0.8rem; }
        .qty-row { display: flex; align-items: center; justify-content: space-between; background: var(--sec); border-radius: 10px; padding: 3px; }
        .qty-row button { width: 28px; height: 28px; border: none; background: #fff; border-radius: 6px; font-weight: 800; }

        .hero { background: linear-gradient(135deg, #2481cc, #1c6ba8); padding: 40px 20px; text-align: center; color: #fff; border-radius: 0 0 30px 30px; margin: -20px -15px 20px; }
        .avatar { width: 80px; height: 80px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; overflow: hidden; }

        .nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); display: flex; border-top: 1px solid #eee; z-index: 1000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 800; color: #888; position: relative; }
        .nav-tab.active { color: var(--p); }
        .nbadge { position: absolute; top: 12px; right: 20%; background: #ef4444; color: #fff; font-size: 0.6rem; padding: 1px 5px; border-radius: 10px; }

        .cart-row { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--sec); border-radius: 15px; margin-bottom: 10px; }
        .float-go { position: fixed; bottom: 85px; left: 15px; right: 15px; background: var(--p); color: #fff; padding: 15px; border-radius: 15px; font-weight: 800; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.1); z-index: 900; }
    </style>
</head>
<body>
    <div id="ls"><div class="logo">🍽️</div><div style="font-weight:600;opacity:0.4;font-size:0.8rem">v5.0 Optimized</div></div>

    <main id="v-menu" class="view active">
        <div id="cats" class="cat-bar"></div>
        <div id="menu-grid" class="grid"></div>
    </main>

    <main id="v-cart" class="view">
        <h2 style="margin-bottom:15px">Savat</h2>
        <div id="cart-list"></div>
        <div id="cart-empty" class="hidden" style="text-align:center;padding:50px;opacity:0.5">🛒 Hali bo'sh</div>
        <div id="cart-foot" class="hidden">
            <textarea id="note" placeholder="Izoh..." style="width:100%;padding:12px;border:none;background:var(--sec);border-radius:12px;margin:15px 0;min-height:80px;"></textarea>
            <div style="padding:15px;background:var(--sec);border-radius:15px;display:flex;justify-content:space-between;font-weight:800">Total: <span id="total-val" style="color:var(--p)">0</span></div>
            <button onclick="app.sendOrder()" style="width:100%;padding:15px;background:var(--p);color:#fff;border:none;border-radius:15px;margin-top:15px;font-weight:800">Tasdiqlash</button>
        </div>
    </main>

    <main id="v-prof" class="view">
        <div class="hero">
            <div class="avatar" id="u-avatar">👤</div>
            <h2 id="u-name">Yuklanmoqda...</h2>
        </div>
        <div style="padding:15px;background:var(--sec);border-radius:15px;font-weight:600">📞 Tel: <span id="u-phone" style="float:right">-</span></div>
        <button onclick="app.sync()" style="width:100%;padding:12px;margin-top:15px;background:var(--p);color:#fff;border:none;border-radius:12px;font-weight:600">Yangilash 🔄</button>
    </main>

    <div id="float" class="float-go hidden" onclick="app.tab('cart')">🛒 Davom etish → <span id="float-sum">0</span></div>

    <nav class="nav">
        <div class="nav-tab active" id="n-menu" onclick="app.tab('menu')">🍽️<br>Menyu</div>
        <div class="nav-tab" id="n-cart" onclick="app.tab('cart')">🛒<br>Savat<div id="badge" class="nbadge hidden">0</div></div>
        <div class="nav-tab" id="n-prof" onclick="app.tab('prof')">👤<br>Profil</div>
    </nav>

    <script>
        class FoodApp {
            constructor() {
                this.tg = window.Telegram?.WebApp;
                this.cart = {}; this.items = []; this.cur = 'menu';
                this.init();
            }
            async init() {
                if (this.tg) { this.tg.ready(); this.tg.expand(); this.sync(); }
                setTimeout(() => { const l = document.getElementById('ls'); if(l) l.style.display='none'; }, 2000);
                try { await this.load(); } catch(e){}
            }
            async load() {
                const r = await fetch('https://olmazorgo.bigsaver.ru/bot/api/menu.php');
                this.items = await r.json();
                this.rC(); this.rI();
            }
            async sync() {
                let u = this.tg?.initDataUnsafe?.user;
                if (!u && this.tg?.initData) { try { u = JSON.parse(new URLSearchParams(this.tg.initData).get('user')); } catch(e){} }
                if (u) {
                    document.getElementById('u-name').textContent = u.first_name + (u.last_name?' '+u.last_name:'');
                    if(u.photo_url) document.getElementById('u-avatar').innerHTML = `<img src="${u.photo_url}" style="width:100%;height:100%;object-fit:cover">`;
                    try {
                        const r = await fetch('/bot/api/user.php?id=' + u.id);
                        const data = await r.json();
                        if (data.ok && data.user) document.getElementById('u-phone').textContent = data.user.phone_number || '-';
                    } catch(e){}
                }
            }
            rC() {
                const c = document.getElementById('cats'); c.innerHTML = '<button class="cat-btn active" onclick="app.fil(\'all\',this)">Barchasi</button>';
                this.items.forEach(cat => c.innerHTML += `<button class="cat-btn" onclick="app.fil(${cat.id},this)">${cat.name}</button>`);
            }
            rI(id = 'all') {
                const g = document.getElementById('menu-grid'); g.innerHTML = '';
                let list = (id==='all') ? this.items.flatMap(c=>c.items) : (this.items.find(c=>c.id==id)?.items||[]);
                list.forEach(i => {
                    const d = document.createElement('div'); d.className = 'card';
                    const q = this.cart[i.id]?.q || 0;
                    d.innerHTML = `<img src="${i.image_url||''}"><div class="card-body"><div><div class="name">${i.name}</div><div class="price">${this.fmt(i.price)}</div></div><div id="i-${i.id}">${q>0?this.qH(i.id,q):`<button class="add-btn" onclick="app.add(${i.id},'${i.name}',${i.price})">Qo'shish</button>`}</div></div>`;
                    g.appendChild(d);
                });
            }
            qH(id,q) { return `<div class="qty-row"><button onclick="app.ch(${id},-1)">−</button><span>${q}</span><button onclick="app.ch(${id},1)">+</button></div>`; }
            fil(id,b) { document.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); this.rI(id); }
            add(id,n,p) { this.cart[id]={id,n,p,q:1}; this.up(id); this.tg?.HapticFeedback.impactOccurred('light'); }
            ch(id,d) { if(!this.cart[id])return; this.cart[id].q+=d; if(this.cart[id].q<=0)delete this.cart[id]; this.up(id); if(this.cur==='cart')this.rCart(); }
            up(id) { const c=document.getElementById(`i-${id}`); if(c) c.innerHTML=this.cart[id]?this.qH(id,this.cart[id].q): `<button class="add-btn" onclick="app.add(${id},'${this.find(id).name}',${this.find(id).price})">Qo'shish</button>`; this.syB(); }
            syB() {
                const list = Object.values(this.cart); const sum = list.reduce((s,i)=>s+i.p*i.q,0); const n = list.reduce((s,i)=>s+i.q,0);
                const b = document.getElementById('badge'); b.textContent=n; b.classList.toggle('hidden', n==0);
                const f = document.getElementById('float'); if(f) { if(n>0 && this.cur==='menu'){ f.classList.remove('hidden'); document.getElementById('float-sum').textContent=this.fmt(sum); } else f.classList.add('hidden'); }
            }
            tab(t) {
                if(this.cur===t)return; this.cur=t;
                document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); document.getElementById(`v-${t}`).classList.add('active');
                document.querySelectorAll('.nav-tab').forEach(n=>n.classList.remove('active')); document.getElementById(`n-${t}`).classList.add('active');
                if(t==='cart')this.rCart(); this.syB(); window.scrollTo(0,0);
            }
            rCart() {
                const l=document.getElementById('cart-list'), e=document.getElementById('cart-empty'), f=document.getElementById('cart-foot'), list=Object.values(this.cart);
                if(list.length==0){ l.innerHTML=''; e.classList.remove('hidden'); f.classList.add('hidden'); }
                else {
                    e.classList.add('hidden'); f.classList.remove('hidden'); l.innerHTML='';
                    list.forEach(i=> {
                        const d=document.createElement('div'); d.className='cart-row';
                        d.innerHTML=`<div style="flex:1"><b>${i.n}</b><br><small>${this.fmt(i.p)}</small></div><div style="width:100px">${this.qH(i.id,i.q)}</div>`;
                        l.appendChild(d);
                    });
                    document.getElementById('total-val').textContent = this.fmt(list.reduce((s,i)=>s+i.p*i.q, 0));
                }
            }
            sendOrder() {
                const list=Object.values(this.cart); if(list.length==0)return;
                const d={items:list, total:list.reduce((s,i)=>s+i.p*i.q,0), note:document.getElementById('note').value};
                this.tg?.sendData(JSON.stringify(d)); this.tg?.close();
            }
            find(id) { return this.items.flatMap(c=>c.items).find(i=>i.id==id); }
            fmt(n) { return Number(n).toLocaleString('uz-UZ').replace(/,/g,' ')+' so\'m'; }
        }
        const app = new FoodApp();
    </script>
</body>
</html>
