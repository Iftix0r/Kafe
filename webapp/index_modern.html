<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍽 Olmazor Go - Menyu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style_modern.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-logo">🍽</div>
            <div class="loading-text">Olmazor Go</div>
            <div class="loading-spinner"></div>
            <div class="loading-subtitle">Menyu yuklanmoqda...</div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="app hidden">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="header-title">
                    <span class="header-emoji">🍽</span>
                    <span class="header-text">Olmazor Go</span>
                </div>
                <div class="header-badge" id="cart-badge">0</div>
            </div>
        </header>

        <!-- Categories -->
        <div class="categories-container">
            <div class="categories" id="categories">
                <div class="category-skeleton"></div>
                <div class="category-skeleton"></div>
                <div class="category-skeleton"></div>
            </div>
        </div>

        <!-- Menu Content -->
        <main class="main-content">
            <div id="menu" class="menu-container">
                <!-- Skeleton Loading -->
                <div class="skeleton-section">
                    <div class="skeleton-title"></div>
                    <div class="skeleton-grid">
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Comment Section -->
        <div class="comment-section">
            <div class="comment-container">
                <div class="comment-icon">💬</div>
                <textarea 
                    id="comment" 
                    placeholder="Maxsus so'rovingiz bor? Yozing..."
                    maxlength="200"
                ></textarea>
                <div class="comment-counter">
                    <span id="comment-count">0</span>/200
                </div>
            </div>
        </div>

        <!-- Cart Summary (when items added) -->
        <div id="cart-summary" class="cart-summary hidden">
            <div class="cart-content">
                <div class="cart-info">
                    <div class="cart-items-count">
                        <span id="cart-items-text">0 ta mahsulot</span>
                    </div>
                    <div class="cart-total">
                        <span id="cart-total-text">0 so'm</span>
                    </div>
                </div>
                <button class="cart-button" id="cart-button">
                    <span>Buyurtma berish</span>
                    <span class="cart-arrow">→</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Success Animation -->
    <div id="success-animation" class="success-animation hidden">
        <div class="success-content">
            <div class="success-checkmark">✓</div>
            <div class="success-text">Buyurtma yuborildi!</div>
        </div>
    </div>

    <script src="app_modern.js"></script>
</body>
</html>
